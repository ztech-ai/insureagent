<script>

 function privacy(){return header('隐私与数据')+`<main class="zk-main"><section class="zk-card"><h2>语音处理</h2><div class="zk-usage"><span>转写方式</span><strong>云端服务转写</strong></div><p class="zk-micro" style="margin-top:10px">音频会上传至受控云端进行转写；后续 AI 分析使用经过敏感信息处理的文本。</p><label class="zk-field">录音保留<select id="zk-retention"><option value="delete" ${state.audioRetention==='delete'?'selected':''}>转写后删除录音</option><option value="7days" ${state.audioRetention==='7days'?'selected':''}>保留 7 天</option></select></label><p class="zk-micro" style="margin-top:10px">删除录音不等于从未上传；已保存的文字需单独管理。</p></section><section class="zk-card"><h2>你的资料，你来管理</h2><button class="zk-list-button" data-go="export"><span class="zk-grow">导出客户资料<br><span class="zk-micro">默认不包含完整联系方式和证件</span></span><span class="zk-chevron">›</span></button><button class="zk-list-button" data-go="devices"><span class="zk-grow">管理登录设备</span><span class="zk-chevron">›</span></button><button class="zk-list-button" data-go="delete"><span class="zk-grow zk-danger">删除客户及相关记录</span><span class="zk-chevron">›</span></button></section><div class="zk-note">停止主动联系、停止 AI 分析与删除资料是不同操作，请按需要分别设置。</div>${button('查看数据处理说明','privacy-detail','zk-text-button zk-block')}</main>`;}
 function contact(){return header('联系偏好',n())+`<main class="zk-main"><p class="zk-muted" style="margin:12px 0;font-size:14px">按照客户表达的意愿安排联系。</p>${[['normal','正常跟进','按已确认的渠道和时间安排'],['pause','暂停联系','暂停主动建议与提醒，档案仍可查看'],['never','不再主动联系','持续停止主动经营，由你明确恢复']].map(([v,t,d])=>`<label class="zk-choice"><input type="radio" name="zk-contact" value="${v}" ${state.contact===v?'checked':''}><span><strong>${t}</strong><br><span class="zk-micro">${d}</span></span></label>`).join('')}<label class="zk-field">记录客户的原话（可选）<textarea id="zk-contact-note" placeholder="例如：近期比较忙，先不要联系我"></textarea></label>${button('保存联系偏好','save-contact','zk-primary zk-block')}<p class="zk-micro" style="margin-top:12px">不会删除历史资料或撤回客户的其他数据处理授权。</p></main>`;}
 function source(){return header('沟通记录','11 月 13 日 18:20 · 微信后口述')+`<main class="zk-main">${badge('原始依据')}<section class="zk-card"><h2>${n()} · 家庭保障沟通</h2><p class="zk-quote">${esc(state.recordText)}</p><p class="zk-micro" style="margin-top:14px">关联客户：${esc(state.activeId)}<br>录音已按保留策略删除，文字保留。</p></section><div class="zk-note">${state.sourceEdited?'相关建议已标记待更新，旧建议不能再直接采纳。':'如有听写错误或事实变化，可以更正来源。相关建议会同步失效并重新整理。'}</div>${button('更正这条记录','edit-source','zk-primary zk-block')}${goButton('返回客户','customer','zk-secondary zk-block')}</main>`;}
 function plans(){return header('选择适合你的用法')+`<main class="zk-main"><section class="zk-card"><h2>免费版</h2><p style="margin-top:8px;font-size:14px">100 位客户 · 60 分钟语音 / 月<br>基础记录、手动任务和提醒</p>${badge('基础方案')}</section><section class="zk-card"><div class="zk-row zk-between"><h2>专业版</h2>${badge('当前套餐')}</div><p style="margin-top:12px;font-size:14px;line-height:1.9">1000 位客户<br>300 分钟语音 / 月<br>200 次深度分析 / 月<br>持续经营建议与计划</p><p class="zk-micro" style="margin-top:12px">价格与正式套餐待商业评审。订阅前须展示费用、周期、自动续费及取消方式。</p>${button('查看订阅说明','subscription-info','zk-primary zk-block')}</section><div class="zk-note">降级后保留已有资料；超出额度时限制新增和高级处理，仍可查询、纠错、导出和删除。</div>${button('恢复购买','restore-purchase','zk-secondary zk-block')}</main>`;}
 function special(){
  if(state.screen==='task-edit')return taskEdit();if(state.screen==='complete')return complete();if(state.screen==='contact')return contact();if(state.screen==='source')return source();if(state.screen==='plans')return plans();
  if(state.screen==='inbox')return header('沟通记录')+`<main class="zk-main"><button class="zk-list-button" data-go="confirm"><span class="zk-avatar">待</span><span class="zk-grow">今天的口述记录<br><span class="zk-micro">文字已保存 · 待确认客户</span></span><span>›</span></button><button class="zk-list-button" data-go="source"><span class="zk-avatar">✓</span><span class="zk-grow">11 月 13 日沟通<br><span class="zk-micro">已归档 · ${n()}</span></span><span>›</span></button></main>`;
  if(state.screen==='draft')return header('本机草稿')+`<main class="zk-main"><div class="zk-note zk-note-warn">${state.scenario==='offline'?'尚未上传到云端。网络恢复后可继续。':'云端转写额度已用完，草稿仍在本机。'}</div><section class="zk-card"><h2>今天 09:41 的记录</h2><p style="margin-top:10px;font-size:14px">00:38 · 待上传</p><p class="zk-micro" style="margin-top:10px">原型仅演示状态；正式 APP 会将草稿加密保存在本机。</p></section>${state.scenario==='offline'?button('模拟网络恢复并继续','retry','zk-primary zk-block'):goButton('查看套餐与额度','me','zk-primary zk-block')}${goButton('返回今天','today','zk-secondary zk-block')}</main>`;
  if(state.screen==='edit-source'||state.screen==='edit-transcript')return header('更正记录','保存后相关建议会重新整理')+`<main class="zk-main"><label class="zk-field">沟通原文<textarea id="zk-edit-text">${esc(state.recordText)}</textarea></label><p class="zk-micro" style="margin-top:12px">更正内容会保留版本历史。已引用旧内容的建议将标记待更新。</p>${button('保存更正','save-correction','zk-primary zk-block')}</main>`;
  if(state.screen==='new-customer')return header('新建客户')+`<main class="zk-main"><label class="zk-field">姓名或称呼<input id="zk-new-name" placeholder="例如：陈女士" maxlength="30"></label><label class="zk-field">备注（可选）<textarea placeholder="认识途径、方便联系的时间…" id="zk-new-note"></textarea></label><div class="zk-note">仅记录有适当依据使用的客户信息。首次使用应完成数据处理说明与授权设置。</div>${button('创建客户档案','create-customer','zk-primary zk-block')}</main>`;
  if(state.screen==='devices')return header('登录设备')+`<main class="zk-main"><section class="zk-card"><h2>当前 iPhone</h2><p class="zk-micro" style="margin-top:8px">本机 · 最近活动：现在</p></section><section class="zk-card"><h2>Android 手机</h2><p class="zk-micro" style="margin-top:8px">最近活动：昨天 20:12</p>${button(state.revoked?'设备已移除':'移除这台设备','revoke-device','zk-text-button',state.revoked?'disabled':'')}</section><div class="zk-note">移除后服务器会拒绝该设备的新请求；离线设备上的本地副本需下次联网才能清理。</div>${button('账号恢复与换号说明','recovery','zk-text-button zk-block')}</main>`;
  if(state.screen==='export')return header('导出客户资料')+`<main class="zk-main"><section class="zk-card"><h2>选择导出内容</h2><label class="zk-check"><input type="checkbox" checked disabled><span>客户基本资料与沟通记录</span></label><label class="zk-check"><input type="checkbox"><span>包含完整联系方式<br><span class="zk-micro">需要再次验证身份</span></span></label><p class="zk-micro" style="margin-top:12px">证件信息默认排除。生成后提供有时效的下载入口。</p></section>${button('验证身份并申请导出','request-export','zk-primary zk-block')}<p class="zk-micro" style="margin-top:12px">演示不会生成文件或读取实际资料。</p></main>`;
  if(state.screen==='delete')return header('删除客户资料')+`<main class="zk-main">${state.deleted?'<div class="zk-note">删除请求已提交（演示）。档案立即停止访问，清理进度可继续查看。</div><section class="zk-card"><h2>正在清理相关资料</h2><p class="zk-micro" style="margin-top:10px">进行中：记录、摘要、向量和建议<br>不提供恢复或撤销入口</p></section>':`<section class="zk-card"><h2 class="zk-danger">删除 ${n()} 及其资料</h2><p style="font-size:14px;margin-top:12px">包括客户档案、归属明确的沟通记录、衍生摘要、检索索引和相关建议；涉及多位客户的记录需先核实归属。</p><p class="zk-micro" style="margin-top:12px">目标：立即停止访问，在线副本 72 小时内清理；备份按最长 30 天生命周期过期，恢复时继续执行删除。具体承诺需随上线存储策略核定。</p></section><label class="zk-check"><input type="checkbox" id="zk-delete-check" ${state.deleteConfirmed?'checked':''}><span>我已了解删除范围，提交后无法撤销。</span></label>${button('确认提交删除（演示）','submit-delete','zk-danger-button zk-block',state.deleteConfirmed?'':'disabled')}`}<p class="zk-micro" style="margin-top:16px">仅演示流程，不执行真实删除。</p></main>`;
  if(state.screen==='feedback')return header('帮助与反馈')+`<main class="zk-main"><label class="zk-field">反馈内容<textarea id="zk-feedback" placeholder="哪里不准确，或哪里不方便？"></textarea></label><label class="zk-check"><input type="checkbox"><span>附上当前建议编号<br><span class="zk-micro">不默认附上客户原文和联系方式</span></span></label>${button('保存反馈（演示）','submit-feedback','zk-primary zk-block')}</main>`;
  return today();
 }
 const views={today,record,confirm,customers,customer,insight,tasks,assistant,me,privacy};
 function render(){const html=views[state.screen]?views[state.screen]():special();app.innerHTML=(state.note?`<div class="zk-notice" role="status">${esc(state.note)}</div>`:'')+html;root.querySelector('.zk-phone').classList.toggle('zk-large',design.largeText);picker.value=screens[state.screen]?state.screen:'customer';scenarioPicker.value=state.scenario;}
 root.addEventListener('click',e=>{
  const target=e.target.closest('button');if(!target)return;
  if(target.dataset.go){navigate(target.dataset.go);return;}
  if(target.dataset.customer){const p=people.find(p=>p.id===target.dataset.customer);state.activeName=p.name;state.activeId=p.id;navigate('customer');return;}
  if(target.dataset.filter){state.filter=target.dataset.filter;render();return;}
  if(target.dataset.taskFilter){state.taskFilter=target.dataset.taskFilter;render();return;}
  const action=target.dataset.action;if(!action)return;state.note='';
  switch(action){
   case 'back':state.screen=state.history.pop()||'today';break;
   case 'record':state.paused=false;navigate('record');return;
   case 'pause':state.paused=!state.paused;break;
   case 'text-mode':state.textMode=true;break;
   case 'finish-record':{const field=root.querySelector('#zk-record-text');if(field){if(!field.value.trim()){notify('请先填写沟通内容。');break;}state.recordText=field.value.trim();}navigate(['offline','quota'].includes(state.scenario)?'draft':'confirm');return;}
   case 'permission-help':notify('请在手机系统设置 → 保知伴 AI → 麦克风中开启权限。');break;
   case 'retry':state.scenario='normal';navigate('confirm');return;
   case 'archive':if(!state.chosen)break;state.archived=true;state.activeId=state.chosen==='new'?'CX-0043':state.chosen==='another'?'CX-0039':'CX-0042';state.activeName='陈敏';navigate('customer');notify(`已归档记录，${state.facts.size} 项事实已确认；其余仍待确认。`);break;
   case 'source':case 'latest-source':navigate('source');return;
   case 'edit-source':navigate('edit-source');return;
   case 'edit-transcript':navigate('edit-transcript');return;
   case 'save-correction':{const field=root.querySelector('#zk-edit-text');if(!field.value.trim()){notify('记录内容不能为空。');break;}state.recordText=field.value.trim();state.sourceEdited=true;navigate('customer');notify('记录已更正，相关建议已标记待更新。');break;}
   case 'regenerate':notify('演示：已提交重新分析。原建议继续标记待更新，收到新结果后才可采纳。');break;
   case 'save-task':{if(state.contact!=='normal'){notify('客户已限制主动联系，请先核对联系偏好。');break;}const title=root.querySelector('#zk-task-title').value.trim(),date=root.querySelector('#zk-task-date').value,time=root.querySelector('#zk-task-time').value;if(!title||!date||!time){notify('请填写跟进事项、日期和时间。');break;}state.taskTitle=title;state.taskDate=date;state.taskTime=time;state.channel=root.querySelector('#zk-task-channel').value;state.taskAdded=true;state.taskDone=false;state.taskFilter='all';navigate('tasks');notify('跟进已创建，未向客户发送消息。');break;}
   case 'complete':state.completingZhou=false;state.outcome='';navigate('complete');return;
   case 'complete-zhou':state.completingZhou=true;state.outcome='';navigate('complete');return;
   case 'save-outcome':if(state.outcome){if(state.completingZhou){state.zhouDone=true;state.zhouOutcome=state.outcome;}else{state.taskDone=true;state.taskOutcome=state.outcome;}state.taskFilter='all';navigate('tasks');notify('本次联系结果已保存。');}break;
   case 'postpone':{const date=new Date(state.taskDate+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+1);state.taskDate=date.toISOString().slice(0,10);state.taskPostponed=true;notify('已延期一天，并更新提醒。');break;}
   case 'postpone-zhou':state.zhouPostponed=true;state.taskFilter='future';notify('周先生的跟进已延期至明天 16:00。');break;
   case 'save-contact':{const c=root.querySelector('input[name="zk-contact"]:checked');state.contact=c?.value||'normal';navigate('customer');notify(state.contact==='normal'?'联系偏好已保存。':'主动经营建议和提醒已停止。');break;}
   case 'ask':{const q=root.querySelector('#zk-question').value.trim();if(!q){notify('先输入你想核实的问题。');break;}state.question=q;state.answered=true;break;}
   case 'create-customer':{const name=root.querySelector('#zk-new-name').value.trim();if(!name){notify('请填写姓名或称呼。');break;}state.activeName=name;state.activeId='CX-0043';navigate('customer');notify('新档案已创建，详细情况仍待补充。');break;}
   case 'feedback':navigate('feedback');return;
   case 'submit-feedback':if(!root.querySelector('#zk-feedback').value.trim()){notify('请填写反馈内容。');break;}navigate('insight');notify('反馈已在演示中记录，未发送至外部服务。');break;
   case 'toggle-push':state.push=!state.push;notify(state.push?'演示：提醒已开启。':'演示：系统通知关闭，应用内提醒继续保留。');break;
   case 'restore-purchase':notify('演示：暂未发现可恢复订阅。正式 APP 将通过原购买渠道校验。');break;
   case 'subscription-info':notify('此原型不提供购买；正式订阅页需要明确价格、周期、自动续费和取消方式。');break;
   case 'request-export':notify('演示：下一步为身份验证，验证成功后才会创建导出任务。');break;
   case 'revoke-device':state.revoked=true;notify('演示：已撤销 Android 设备会话，离线副本待下次联网清理。');target.disabled=true;break;
   case 'recovery':notify('换号或账号恢复须核验已有设备与身份，不能仅凭新手机号验证码接管原账号。');break;
   case 'submit-delete':if(state.deleteConfirmed){state.deleted=true;notify('演示删除请求已提交。');}break;
   case 'privacy-detail':notify('原始音频用于受控转写；进入语言模型前处理敏感标识。保留、导出与删除按分别确认的策略执行。');break;
  }
  render();persist();
 });
 root.addEventListener('change',e=>{
  const t=e.target;
  if(t===picker){state.history=[];state.screen=t.value;state.note='';render();persist();return;}
  if(t===scenarioPicker){state.scenario=t.value;state.screen=t.value==='partial'?'confirm':t.value==='normal'?'today':'record';state.note='';render();return;}
  if(t.name==='zk-person'){state.chosen=t.value;const save=root.querySelector('[data-action="archive"]');save.disabled=false;}
  if(t.dataset.fact){t.checked?state.facts.add(t.dataset.fact):state.facts.delete(t.dataset.fact);const save=root.querySelector('[data-action="archive"]');save.textContent=state.facts.size?`归档并确认 ${state.facts.size} 项`:'仅归档到所选客户';}
  if(t.name==='zk-outcome'){state.outcome=t.value;root.querySelector('[data-action="save-outcome"]').disabled=false;}
  if(t.id==='zk-retention'){state.audioRetention=t.value;root.querySelector('#zk-announcement').textContent='录音保留偏好已更新（演示）';}
  if(t.id==='zk-delete-check'){state.deleteConfirmed=t.checked;root.querySelector('[data-action="submit-delete"]').disabled=!t.checked;}
 });
 root.addEventListener('input',e=>{if(e.target.id==='zk-search'){state.search=e.target.value.trim();root.querySelector('#zk-customer-list').innerHTML=listItems();}});
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.zk-phone'),onChange:()=>{render();persist();}});tweak.addToggle(design,'largeText',{label:'增大正文字号'});tweak.addToggle(design,'recordFirst',{label:'首页优先展示录音入口'});}
})();
</script>
